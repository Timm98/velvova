# Supabase — lokale Entwicklung.
#
# Voraussetzung ist Docker. Ist keines vorhanden, läuft die Anwendung
# weiter gegen die eingebettete Datenbank; die Oberfläche sagt das unter
# Einstellungen → Verbundene Dienste ausdrücklich.
#
#   supabase start          # startet Postgres, Auth, Storage
#   supabase db reset       # wendet alle Migrationen und den Seed an
#   supabase db push        # spielt Migrationen in ein Remote-Projekt
project_id = "paycheck"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323

[storage]
enabled = true
# Lebensläufe und Zeugnisse. 20 MB reichen für jedes vernünftige PDF.
file_size_limit = "20MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://localhost:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

# Anbieteranmeldung ist vorgesehen, aber nicht aktiviert: ohne
# hinterlegte Zugangsdaten wäre sie ein Knopf, der nichts tut.
[auth.external.google]
enabled = false
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_CLIENT_SECRET)"
